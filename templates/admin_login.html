<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #eee; display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    .card { background:#1a1d24; padding:2rem; border-radius:12px; width:min(360px, 92vw); box-shadow:0 10px 40px rgba(0,0,0,.4); }
    h1 { margin:0 0 1rem; font-size:1.25rem; }
    input { width:100%; padding:.75rem; margin:.5rem 0 1rem; border-radius:8px; border:1px solid #333; background:#0f1115; color:#fff; box-sizing:border-box; }
    button { width:100%; padding:.75rem; border:0; border-radius:8px; background:#3b82f6; color:#fff; font-weight:600; cursor:pointer; }
    .err { color:#f87171; font-size:.9rem; min-height:1.2rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Login</h1>
    <div class="err" id="err"></div>
    <form id="f">
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <button type="submit">Login</button>
    </form>
  </div>
  <script>
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      try {
        const r = await fetch('/admin/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value })
        });
        const j = await r.json();
        if (j.success || j.ok) location.href = '/admin';
        else err.textContent = j.error || 'Login failed';
      } catch (ex) { err.textContent = 'Network error'; }
    };
  </script>
</body>
</html>
