<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stats</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f1115; color:#eee; margin:0; padding:1.5rem; }
    .grid { display:grid; gap:1rem; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .card { background:#1a1d24; padding:1rem; border-radius:10px; }
    h1 { font-size:1.2rem; }
    a { color:#60a5fa; }
  </style>
</head>
<body>
  <h1>Stats</h1>
  <p><a href="/admin">Back to admin</a></p>
  <div class="grid" id="grid">Loading…</div>
  <script>
    fetch('/admin/api/stats').then(r => r.json()).then(j => {
      const g = document.getElementById('grid');
      g.innerHTML = '';
      const data = j.stats || j || {};
      Object.entries(data).forEach(([k,v]) => {
        const d = document.createElement('div');
        d.className = 'card';
        d.innerHTML = '<strong>'+k+'</strong><div style="font-size:1.4rem;margin-top:.4rem">'+v+'</div>';
        g.appendChild(d);
      });
    }).catch(() => { document.getElementById('grid').textContent = 'Failed to load'; });
  </script>
</body>
</html>
